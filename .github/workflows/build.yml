name: Build APK

# 빌드는 릴리스할 때만: "v0.2.0" 같은 태그를 올리거나 직접 실행할 때.
# 풀 리퀘스트로는 실행되지 않는다(외부인이 Secrets를 쓰거나 빌드를 돌릴 수 없음).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전 (예: v0.2.0)"
        required: false

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # AI 자막 엔진(whisper.cpp·llama.cpp) — 소스가 안 바뀌면 이전 빌드 결과를 재사용
      - name: Cache AI engine
        id: native-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ hashFiles('native/**') }}

      - name: Build AI engine (NDK)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          which ninja || sudo apt-get install -y ninja-build
          bash native/build.sh 2>&1 | tee native.log

      # 서명 키: GitHub Secrets에서 꺼내 파일로 (로그에는 찍히지 않음)
      - name: Signing key from Secrets
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then printf '%s' "$KS" | base64 -d > app/signing.keystore; echo "서명 키: Secrets"; else echo "서명 키: Secrets 없음(임시 키 파일 사용)"; fi

      - name: Build debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 빌드가 실패하면 오류 줄만 골라 요약(annotation)으로 남긴다 — 채팅에서 원인 확인용
      - name: Report build errors
        if: failure()
        run: |
          touch build.log native.log
          msg=$( (grep -A12 "AAR metadata" build.log | head -14; grep -E "^e: |Could not |Unresolved" build.log | head -25; grep -E "error:|Error |FAILED" native.log | head -15)  | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=BuildErrors::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk video-player.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f app/signing.keystore
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="build-${{ github.run_number }}"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" video-player.apk \
            --title "$TAG" \
            --notes "폰에서 video-player.apk를 눌러 받아 설치하세요." \
            --target ${{ github.sha }} --latest
