name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # AI 자막 엔진(whisper.cpp·llama.cpp) — 소스가 안 바뀌면 이전 빌드 결과를 재사용
      - name: Cache AI engine
        id: native-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: native-${{ hashFiles('native/**') }}

      - name: Build AI engine (NDK)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          which ninja || sudo apt-get install -y ninja-build
          bash native/build.sh 2>&1 | tee native.log

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # 빌드가 실패하면 오류 줄만 골라 요약(annotation)으로 남긴다 — 채팅에서 원인 확인용
      - name: Report build errors
        if: failure()
        run: |
          touch build.log native.log
          msg=$( (grep -A12 "AAR metadata" build.log | head -14; grep -E "^e: |Could not |Unresolved" build.log | head -25; grep -E "error:|Error |FAILED" native.log | head -15)  | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=BuildErrors::${msg}"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk video-player.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest video-player.apk \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋: ${{ github.sha }} — 폰에서 video-player.apk를 눌러 받아 설치하세요." \
            --target ${{ github.sha }}
